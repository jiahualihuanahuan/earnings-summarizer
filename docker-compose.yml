services:
  earnings-app:
    build: .
    container_name: earnings-transcript-summarizer
    ports:
      - "8085:8000"
    environment:
      - LLM_BASE_URL=http://192.168.86.35:8001/v1
      - LLM_API_KEY=vllm-secret-key
      - LLM_MODEL=Qwen/Qwen3-8B-AWQ
      - SYNC_INTERVAL_HOURS=1
      - DATABASE_PATH=/app/data/earnings.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
