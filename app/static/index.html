<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earnings Call AI Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose h3 { font-size: 1.15rem; font-weight: 700; color: #38bdf8; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1rem; }
    .prose li { margin-bottom: 0.35rem; color: #e2e8f0; }
    .prose p { margin-bottom: 0.75rem; color: #cbd5e1; }
    .prose strong { color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Top Header -->
  <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold">
          EC
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">Earnings Call AI Terminal</h1>
          <p class="text-xs text-slate-400">Yahoo Finance Free Feed • S&P 500 Auto-Tracker</p>
        </div>
      </div>

      <!-- Ollama Status & Model Selector -->
      <div class="flex items-center gap-3 text-xs">
        <div id="ollamaBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700">
          <span id="ollamaDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="ollamaText" class="text-slate-300">Checking 192.168.86.35:11434...</span>
        </div>
        <select id="modelSelect" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-sky-500">
          <option value="">Default Model</option>
        </select>
        <button onclick="triggerSync()" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium transition">
          ↻ Sync S&P 500
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-10">

    <!-- Search Bar Section -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <label class="block text-sm font-medium text-slate-300 mb-2">
        Search Any Company by Name or Ticker (e.g., <span class="text-sky-400">NVDA</span>, <span class="text-sky-400">Apple</span>, <span class="text-sky-400">AMD</span>, <span class="text-sky-400">Tesla</span>)
      </label>
      <div class="relative">
        <div class="flex gap-3">
          <input
            id="searchInput"
            type="text"
            placeholder="Enter company name or ticker symbol..."
            autocomplete="off"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500"
          />
          <button
            onclick="handleManualSearch()"
            id="searchBtn"
            class="px-6 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold whitespace-nowrap transition"
          >
            Fetch & Summarize
          </button>
        </div>

        <!-- Autocomplete Dropdown -->
        <div id="autocompleteList" class="hidden absolute left-0 right-36 mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-40 divide-y divide-slate-800"></div>
      </div>
      <div id="syncBanner" class="mt-3 text-xs text-slate-400 flex items-center justify-between">
        <span id="syncStatusText">Background status: Idle</span>
      </div>
    </section>

  <!-- Front Page: Top 9 Most Recent S&P 500 Earnings Calls -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold text-white">9 Most Recent S&P 500 Earnings Calls</h2>
          <p class="text-sm text-slate-400">Automatically retrieved and summarized by your local LLM</p>
        </div>
      </div>

      <div id="sp500Grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Populated dynamically -->
      </div>
    </section>

    <!-- Active Transcript & Summary Viewer -->
    <section id="reportSection" class="hidden bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="p-6 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4 bg-slate-900/50">
        <div>
          <div class="flex items-center gap-3">
            <span id="viewSymbol" class="px-2.5 py-1 rounded-md bg-sky-500/20 text-sky-400 font-bold text-sm"></span>
            <h3 id="viewCompany" class="text-xl font-bold text-white"></h3>
            <span id="viewQuarter" class="text-sm text-slate-400"></span>
            <span id="viewSentiment" class="px-2.5 py-0.5 rounded-full text-xs font-medium"></span>
          </div>
          <p id="viewMeta" class="text-xs text-slate-400 mt-1.5"></p>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="switchTab('summary')" id="tabSummaryBtn" class="px-4 py-2 rounded-lg text-sm font-medium bg-sky-500 text-slate-950">
            AI Key Points
          </button>
          <button onclick="switchTab('transcript')" id="tabTranscriptBtn" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">
            Verbatim Transcript
          </button>
          <button onclick="resummarizeCurrent()" id="resummarizeBtn" class="px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 border border-slate-700 text-sky-400 hover:bg-slate-700">
            ↻ Re-Summarize
          </button>
        </div>
      </div>

      <!-- AI Summary Tab -->
      <div id="tabSummary" class="p-6">
        <div id="viewSnippetBox" class="mb-6 p-4 rounded-xl bg-slate-950/80 border border-slate-800 text-slate-200 text-sm italic"></div>
        <div id="viewSummaryMarkdown" class="prose max-w-none leading-relaxed"></div>
      </div>

      <!-- Verbatim Transcript Tab -->
      <div id="tabTranscript" class="hidden p-6 bg-slate-950/50 max-h-[700px] overflow-y-auto space-y-4">
        <div class="sticky top-0 bg-slate-950 pb-3">
          <input
            id="transcriptFilter"
            type="text"
            oninput="filterTranscriptParagraphs()"
            placeholder="Filter transcript by keyword or speaker (e.g. 'guidance', 'margin', 'CEO')..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white"
          />
        </div>
        <div id="viewTranscriptSegments" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <script>
    let currentSymbol = null;
    let currentSegments = [];

    function sentimentBadgeClass(sentiment) {
      if (sentiment === 'Bullish') return 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      if (sentiment === 'Bearish') return 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
      return 'bg-slate-700/60 text-slate-300 border border-slate-600';
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const dot = document.getElementById('ollamaDot');
        const txt = document.getElementById('ollamaText');
        const sel = document.getElementById('modelSelect');

        if (data.ollama_online) {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          txt.textContent = `LLM Online (${data.active_model})`;
          if (sel.options.length <= 1 && data.available_models.length > 0) {
            sel.innerHTML = data.available_models
              .map(m => `<option value="${m}" ${m === data.active_model ? 'selected' : ''}>${m}</option>`)
              .join('');
          }
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-rose-500';
          txt.textContent = `LLM Offline (${data.ollama_url})`;
        }

        const st = data.sync_status;
        document.getElementById('syncStatusText').textContent =
          `Background S&P 500 Sync: ${st.message}` + (st.last_sync ? ` (Last synced: ${st.last_sync})` : '');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadRecentSp500() {
      const grid = document.getElementById('sp500Grid');
      try {
        const res = await fetch('/api/recent-sp500');
        const items = await res.json();

        if (!items.length) {
          grid.innerHTML = `
            <div class="col-span-full bg-slate-900 border border-slate-800 rounded-xl p-8 text-center text-slate-400">
              Initial S&P 500 transcript sync and local LLM summarization is running in the background...
              Refresh or wait a few seconds.
            </div>`;
          return;
        }

        grid.innerHTML = items.map(item => `
          <div onclick="loadCompanyReport('${item.symbol}')"
               class="cursor-pointer group bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-sky-500/50 rounded-2xl p-5 flex flex-col justify-between transition shadow-lg">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-md bg-sky-500/15 text-sky-400 font-bold text-sm">${item.symbol}</span>
                  <span class="text-xs text-slate-400">Q${item.fiscal_quarter} ${item.fiscal_year} • ${item.report_date}</span>
                </div>
                <span class="px-2 py-0.5 rounded-full text-xs font-medium ${sentimentBadgeClass(item.sentiment)}">
                  ${item.sentiment || 'Neutral'}
                </span>
              </div>
              <h3 class="font-semibold text-white group-hover:text-sky-300 transition truncate mb-2">${item.company_name}</h3>
              <p class="text-sm text-slate-300 line-clamp-4 leading-relaxed">${item.snippet || 'Summarizing...'}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-sky-400 font-medium">
              <span>Model: ${item.model_used || 'Local LLM'}</span>
              <span class="group-hover:translate-x-1 transition">Read Full Summary →</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadCompanyReport(queryStr, force = false) {
      const btn = document.getElementById('searchBtn');
      const model = document.getElementById('modelSelect').value;
      const origText = btn.textContent;
      btn.textContent = 'Fetching & Summarizing...';
      btn.disabled = true;

      try {
        const url = `/api/transcript/${encodeURIComponent(queryStr)}?force=${force}` +
                    (model ? `&model=${encodeURIComponent(model)}` : '');
        const res = await fetch(url);
        if (!res.ok) {
          const err = await res.json();
          alert(err.detail || 'Failed to load transcript');
          return;
        }
        const data = await res.json();
        currentSymbol = data.symbol;

        document.getElementById('reportSection').classList.remove('hidden');
        document.getElementById('viewSymbol').textContent = data.symbol;
        document.getElementById('viewCompany').textContent = data.company_name;
        document.getElementById('viewQuarter').textContent = `Q${data.fiscal_quarter} ${data.fiscal_year} (${data.report_date})`;

        const sentEl = document.getElementById('viewSentiment');
        sentEl.textContent = data.sentiment;
        sentEl.className = `px-2.5 py-0.5 rounded-full text-xs font-medium ${sentimentBadgeClass(data.sentiment)}`;

        document.getElementById('viewMeta').textContent =
          `Source: ${data.source} • Summarized by ${data.model_used} at ${data.updated_at}`;
        document.getElementById('viewSnippetBox').textContent = data.snippet;
        document.getElementById('viewSummaryMarkdown').innerHTML = marked.parse(data.summary_markdown || '');

        try {
          currentSegments = JSON.parse(data.segments_json || '[]');
        } catch {
          currentSegments = [];
        }
        renderTranscriptSegments(currentSegments);
        document.getElementById('reportSection').scrollIntoView({ behavior: 'smooth' });
        loadRecentSp500();
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
      }
    }

    function renderTranscriptSegments(segments) {
      const container = document.getElementById('viewTranscriptSegments');
      if (!segments.length) {
        container.innerHTML = `<p class="text-slate-400 text-sm">No structured segments available.</p>`;
        return;
      }
      container.innerHTML = segments.map(seg => `
        <div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800/90">
          <div class="text-xs font-bold text-sky-400 mb-1">${seg.speaker || 'Speaker'}</div>
          <div class="text-sm text-slate-200 leading-relaxed">${seg.content || ''}</div>
        </div>
      `).join('');
    }

    function filterTranscriptParagraphs() {
      const q = document.getElementById('transcriptFilter').value.toLowerCase().trim();
      if (!q) {
        renderTranscriptSegments(currentSegments);
        return;
      }
      const filtered = currentSegments.filter(s =>
        (s.speaker && s.speaker.toLowerCase().includes(q)) ||
        (s.content && s.content.toLowerCase().includes(q))
      );
      renderTranscriptSegments(filtered);
    }

    function switchTab(tab) {
      const sumTab = document.getElementById('tabSummary');
      const trTab = document.getElementById('tabTranscript');
      const sumBtn = document.getElementById('tabSummaryBtn');
      const trBtn = document.getElementById('tabTranscriptBtn');

      if (tab === 'summary') {
        sumTab.classList.remove('hidden');
        trTab.classList.add('hidden');
        sumBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-sky-500 text-slate-950';
        trBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
      } else {
        sumTab.classList.add('hidden');
        trTab.classList.remove('hidden');
        trBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-sky-500 text-slate-950';
        sumBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
      }
    }

    function handleManualSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) {
        document.getElementById('autocompleteList').classList.add('hidden');
        loadCompanyReport(q, false);
      }
    }

    function resummarizeCurrent() {
      if (currentSymbol) loadCompanyReport(currentSymbol, true);
    }

    async function triggerSync() {
      await fetch('/api/sync-sp500', { method: 'POST' });
      loadStatus();
    }

    // Autocomplete Listener
    const searchInput = document.getElementById('searchInput');
    const autoList = document.getElementById('autocompleteList');

    searchInput.addEventListener('input', async (e) => {
      const q = e.target.value.trim();
      if (q.length < 1) {
        autoList.classList.add('hidden');
        return;
      }
      const res = await fetch(`/api/search-companies?q=${encodeURIComponent(q)}`);
      const matches = await res.json();
      if (!matches.length) {
        autoList.classList.add('hidden');
        return;
      }
      autoList.innerHTML = matches.map(m => `
        <div onclick="selectAutocomplete('${m.symbol}')"
             class="px-4 py-2.5 hover:bg-slate-800 cursor-pointer flex items-center justify-between">
          <div>
            <span class="font-bold text-sky-400 mr-2">${m.symbol}</span>
            <span class="text-sm text-slate-200">${m.name}</span>
          </div>
          ${m.is_sp500 ? '<span class="text-[10px] px-2 py-0.5 rounded bg-sky-500/10 text-sky-300 border border-sky-500/20">S&P 500</span>' : ''}
        </div>
      `).join('');
      autoList.classList.remove('hidden');
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleManualSearch();
    });

    function selectAutocomplete(sym) {
      searchInput.value = sym;
      autoList.classList.add('hidden');
      loadCompanyReport(sym, false);
    }

    // Initial Boot Polling
    loadStatus();
    loadRecentSp500();
    setInterval(() => {
      loadStatus();
      loadRecentSp500();
    }, 8000);
  </script>
</body>
</html>
